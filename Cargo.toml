[package]
name = "acia"
version = "0.0.1"
edition = "2024"
description = "AI Command Assistant - CLI assistant that generates shell commands from natural language"

[lib]
name = "acia"
path = "src/lib.rs"

[[bin]]
name = "acia"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rustyline = "12.0"
chrono = "0.4"
unicode-segmentation = "1.10"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.9"
colored = "2.0"
lazy_static = "1.4"

[dev-dependencies]
pretty_assertions = "1.4"
