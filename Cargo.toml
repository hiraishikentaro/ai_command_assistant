[package]
name = "acia"
version = "0.0.1"
edition = "2024"
description = "AI Command Assistant - CLI assistant that generates shell commands from natural language"
authors = ["hiraishikentaro <silva.ken.97@gmail.com>"]

[lib]
name = "acia"
path = "src/lib.rs"

[[bin]]
name = "acia"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rustyline = "12.0"
chrono = "0.4"
unicode-segmentation = "1.10"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.9"
colored = "2.0"
lazy_static = "1.4"

# LLM API 連携用依存関係
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
dirs = "5.0"
async-trait = "0.1"
env_logger = "0.10"
log = "0.4"

[dev-dependencies]
pretty_assertions = "1.4"
mockall = "0.11"
wiremock = "0.5"
